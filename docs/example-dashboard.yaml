# Example dashboard for GAC Connect — core Home Assistant cards only, no extra
# installs needed.
#
# HOW TO USE
#   1. Your entity IDs start with your vehicle's name. This example uses
#      `aion_v` (an "AION V"). If yours differ, find-and-replace `aion_v` with
#      your prefix (Developer Tools → States, filter "gac" or your model).
#   2. Dashboards → + Add Dashboard → New dashboard → open it → Edit (pencil) →
#      three-dot menu → Raw configuration editor → replace everything with this.
#
# TYRE PRESSURE IN PSI: the car reports kPa; to see psi, open a tyre sensor →
# settings (gear) → Unit of measurement → psi. Home Assistant converts it.
#
# LOCATION MAP: the map needs the location tracker. Turn it on in Settings →
# Devices & Services → GAC Connect → Configure → Enable location tracking.
# If it is off, delete the Location section or the map shows nothing.
#
# Layout: `type: sections` with 3 columns. Each section is small so Home
# Assistant balances them; on a narrow screen they stack automatically.

views:
  - title: Car
    path: car
    icon: mdi:car-electric
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Battery
            icon: mdi:battery-high
          - type: gauge
            entity: sensor.aion_v_battery
            name: State of charge
            needle: true
            severity: { green: 60, yellow: 30, red: 0 }
          - type: tile
            entity: sensor.aion_v_range
            name: Range
          - type: tile
            entity: sensor.aion_v_odometer
            name: Odometer

      - type: grid
        cards:
          - type: heading
            heading: Charging
            icon: mdi:ev-station
          - type: tile
            entity: binary_sensor.aion_v_plugged_in
            name: Plug
          - type: tile
            entity: binary_sensor.aion_v_charging
            name: Charging
          - type: tile
            entity: switch.aion_v_scheduled_charging
            name: Scheduled
          - type: tile
            entity: sensor.aion_v_estimated_charge_time
            name: Charge time
          - type: conditional
            conditions:
              - entity: binary_sensor.aion_v_charging
                state: "on"
            card:
              type: tile
              entity: sensor.aion_v_charge_current
              name: Charging at
          - type: tile
            entity: button.aion_v_charge_now
            name: Charge now
            tap_action: { action: toggle }
          - type: tile
            entity: button.aion_v_pause_charging
            name: Pause
            tap_action: { action: toggle }

      - type: grid
        cards:
          - type: heading
            heading: History
            icon: mdi:chart-line
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.aion_v_battery
                name: Battery
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.aion_v_range
                name: Range

      - type: grid
        cards:
          - type: heading
            heading: Security & climate
            icon: mdi:shield-car
          - type: tile
            entity: binary_sensor.aion_v_lock
            name: Locks
          - type: tile
            entity: binary_sensor.aion_v_door
            name: Doors
          - type: tile
            entity: binary_sensor.aion_v_window
            name: Windows
          - type: tile
            entity: binary_sensor.aion_v_boot
            name: Boot
          - type: tile
            entity: sensor.aion_v_cabin_temperature
            name: Cabin
          - type: tile
            entity: sensor.aion_v_12v_battery
            name: 12V

      - type: grid
        cards:
          - type: heading
            heading: Tyres
            icon: mdi:car-tire-alert
          - type: tile
            entity: sensor.aion_v_tyre_1_pressure
            name: Front left
          - type: tile
            entity: sensor.aion_v_tyre_2_pressure
            name: Front right
          - type: tile
            entity: sensor.aion_v_tyre_3_pressure
            name: Rear left
          - type: tile
            entity: sensor.aion_v_tyre_4_pressure
            name: Rear right

      - type: grid
        cards:
          - type: heading
            heading: Location
            icon: mdi:map-marker
          - type: tile
            entity: binary_sensor.aion_v_online
            name: Online
          - type: map
            entities:
              - device_tracker.aion_v_location
            hours_to_show: 0
            aspect_ratio: "1:1"
