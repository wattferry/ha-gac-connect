# Trips and consumption for a GAC Connect vehicle, built from Home Assistant's
# own utility meters and template sensors.
#
# GAC's API reports the odometer, the battery level and the average of the
# current or last drive (the Trip consumption sensor), but no trip history and no
# per-week, per-month or per-year figures. The kilometres this week, month and
# year are counted by Home Assistant from the odometer readings, starting when you
# add this file, and the consumption over each is estimated from the battery level.
#
# WHAT YOU GET
#   Kilometres driven this week, this month and this year, and the estimated
#   average consumption over each (kWh/100 km), plus an overall average since you
#   added this file.
#
# HOW TO USE
#   1. Your entity IDs start with your vehicle's name. This example uses
#      `my_car`; find-and-replace BOTH `my_car` (the entity IDs) AND `My car`
#      (the names these sensors are created from, which set their entity IDs)
#      with your car's. Developer Tools → States, filter "gac" or your car's
#      name, shows the IDs your car uses.
#   2. Set PACK_KWH below to your battery's usable capacity in kWh. The value
#      here is only an example; take yours from your car's documentation.
#   3. Save this file as `packages/gac_trips.yaml` in your config folder and make
#      sure configuration.yaml loads packages:
#          homeassistant:
#            packages: !include_dir_named packages
#   4. Restart Home Assistant.
#
# HOW CONSUMPTION IS ESTIMATED
#   Energy used = the drop in battery level between readings × PACK_KWH. It is an
#   estimate from the battery percentage Home Assistant happens to observe, not a
#   measured figure, so treat it as a rough guide:
#     - Charging is not counted (the meter ignores the level rising), but any
#       drain between readings is, including while parked (pre-conditioning, the
#       fridge, standby).
#     - A drive and a recharge that both fall between two readings are missed, so
#       energy can be under-counted while the distance still counts.
#     - The battery percentage is coarse and rounded, and readings can straddle a
#       week/month boundary, so a period's figure can be off either way.
#   It is only as accurate as PACK_KWH and the reported percentage, and assumes
#   the odometer reads in kilometres (the integration reports km; if you have
#   switched that entity to miles, the kWh/100km figure will be wrong). Stays
#   Unknown until at least 5 km are counted.
#
#   NOTE: this average is Home Assistant's estimate, not the car's figure. The
#   API has an average-consumption field, but it does not match the trip
#   computer (it reads 0.0 on some cars), so it is not used here.
#
# STARTING TOTALS
#   Everything starts at zero when you add this file. The weekly, monthly and
#   yearly meters reset on their own. To start the overall average from your
#   car's trip computer instead, call the `utility_meter.calibrate` action once
#   for each "tracked" meter: sensor.my_car_km_tracked with the kilometres the
#   trip computer shows, and sensor.my_car_energy_tracked with those kilometres
#   × its kWh/100 km ÷ 100.

template:
  - sensor:
      - name: My car battery energy below full
        unique_id: my_car_battery_energy_below_full
        unit_of_measurement: kWh
        device_class: energy
        state_class: total
        state: >-
          {% set PACK_KWH = 75 %}
          {% set b = states('sensor.my_car_battery') | float(none) %}
          {{ (PACK_KWH * (100 - b) / 100) | round(2) if b is not none else none }}

      - name: My car consumption this week
        unique_id: my_car_consumption_this_week
        unit_of_measurement: kWh/100km
        device_class: energy_distance
        state_class: measurement
        state: >-
          {% set e = states('sensor.my_car_energy_this_week') | float(none) %}
          {% set k = states('sensor.my_car_km_this_week') | float(none) %}
          {{ (e / k * 100) | round(1) if e is not none and k is not none and k >= 5 else none }}

      - name: My car consumption this month
        unique_id: my_car_consumption_this_month
        unit_of_measurement: kWh/100km
        device_class: energy_distance
        state_class: measurement
        state: >-
          {% set e = states('sensor.my_car_energy_this_month') | float(none) %}
          {% set k = states('sensor.my_car_km_this_month') | float(none) %}
          {{ (e / k * 100) | round(1) if e is not none and k is not none and k >= 5 else none }}

      - name: My car consumption this year
        unique_id: my_car_consumption_this_year
        unit_of_measurement: kWh/100km
        device_class: energy_distance
        state_class: measurement
        state: >-
          {% set e = states('sensor.my_car_energy_this_year') | float(none) %}
          {% set k = states('sensor.my_car_km_this_year') | float(none) %}
          {{ (e / k * 100) | round(1) if e is not none and k is not none and k >= 5 else none }}

      - name: My car consumption overall
        unique_id: my_car_consumption_overall
        unit_of_measurement: kWh/100km
        device_class: energy_distance
        state_class: measurement
        state: >-
          {% set e = states('sensor.my_car_energy_tracked') | float(none) %}
          {% set k = states('sensor.my_car_km_tracked') | float(none) %}
          {{ (e / k * 100) | round(1) if e is not none and k is not none and k >= 5 else none }}

# `periodically_resetting: false` matters for the energy meters: the battery
# level rises when the car charges, and that must not be read as a reset.
utility_meter:
  my_car_km_this_week:
    name: My car km this week
    unique_id: my_car_km_this_week
    source: sensor.my_car_odometer
    cycle: weekly
    periodically_resetting: false
  my_car_km_this_month:
    name: My car km this month
    unique_id: my_car_km_this_month
    source: sensor.my_car_odometer
    cycle: monthly
    periodically_resetting: false
  my_car_km_this_year:
    name: My car km this year
    unique_id: my_car_km_this_year
    source: sensor.my_car_odometer
    cycle: yearly
    periodically_resetting: false
  my_car_km_tracked:
    name: My car km tracked
    unique_id: my_car_km_tracked
    source: sensor.my_car_odometer
    periodically_resetting: false

  my_car_energy_this_week:
    name: My car energy this week
    unique_id: my_car_energy_this_week
    source: sensor.my_car_battery_energy_below_full
    cycle: weekly
    periodically_resetting: false
  my_car_energy_this_month:
    name: My car energy this month
    unique_id: my_car_energy_this_month
    source: sensor.my_car_battery_energy_below_full
    cycle: monthly
    periodically_resetting: false
  my_car_energy_this_year:
    name: My car energy this year
    unique_id: my_car_energy_this_year
    source: sensor.my_car_battery_energy_below_full
    cycle: yearly
    periodically_resetting: false
  my_car_energy_tracked:
    name: My car energy tracked
    unique_id: my_car_energy_tracked
    source: sensor.my_car_battery_energy_below_full
    periodically_resetting: false
