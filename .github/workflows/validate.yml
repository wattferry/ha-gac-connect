name: Validate
on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported release (energy-distance sensors need 2025.3) and the latest.
          - python: "3.13"
            ha: "2025.3.0"
          - python: "3.14"
            ha: "2026.10.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Home Assistant and test tools
        run: python -m pip install 'homeassistant==${{ matrix.ha }}' 'pytest>=9,<10' 'ruff>=0.16,<0.17'
      - name: Install the exact manifest requirements
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          manifest = json.loads(Path('custom_components/gac_connect/manifest.json').read_text())
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *manifest['requirements']])
          PY
      - name: Test the integration with the library
        run: python -m pytest -q
      - name: Static checks
        run: ruff check custom_components tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the card build tools
        working-directory: frontend
        run: npm ci
      - name: Type-check and build the cards; the committed bundle must match
        working-directory: frontend
        run: |
          npm run build
          git diff --exit-code -- ../custom_components/gac_connect/frontend
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
